name: Go readability
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  readability:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.11.4
          skip-cache: true
          skip-run: true
      - run: python3 -m unittest discover -s scripts/tests -p test_go_lint_baseline.py -v
      - run: python3 scripts/check_go_lint_baseline.py --check
