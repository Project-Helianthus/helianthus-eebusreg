name: Go readability
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  readability:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned golangci-lint
        run: |
          GOBIN="$RUNNER_TEMP/golangci-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          echo "$RUNNER_TEMP/golangci-bin" >> "$GITHUB_PATH"
      - run: python3 -m unittest discover -s scripts/tests -p test_go_lint_baseline.py -v
      - run: python3 scripts/check_go_lint_baseline.py --check
