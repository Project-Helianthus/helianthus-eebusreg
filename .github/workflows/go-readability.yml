name: Go readability
on:
  pull_request:
  push:

permissions:
  actions: read
  contents: read

jobs:
  readability:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Read additive routing result
        id: route
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/preflight/routing.py read-result --head "${{ github.event.pull_request.head.sha }}" --base "${{ github.event.pull_request.base.sha }}"
      - name: Install pinned golangci-lint
        run: |
          GOBIN="$RUNNER_TEMP/golangci-bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4
          echo "$RUNNER_TEMP/golangci-bin" >> "$GITHUB_PATH"
      - if: github.event_name != 'pull_request' || steps.route.outputs.suppress != 'true'
        run: python3 -m unittest discover -s scripts/tests -p test_go_lint_baseline.py -v
      - if: github.event_name != 'pull_request' || steps.route.outputs.suppress != 'true'
        run: python3 scripts/check_go_lint_baseline.py --check
