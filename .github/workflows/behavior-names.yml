name: Behavior names
on:
  pull_request:
  push:

jobs:
  behavior-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: python3 -m unittest discover -s scripts/tests -p test_behavior_name_gate.py -v
      - run: python3 scripts/check_behavior_names.py --check
